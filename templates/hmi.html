<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini SCADA - Operator Console</title>
<link rel="stylesheet" href="/static/css/hmi.css?v={{ v }}">
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>Mini SCADA</h1>
  <nav class="nav">
    <button data-console="soc">System Operator Console</button>
    <button data-console="trend">Trending</button>
    <button data-console="storm">Storm Watch</button>
  </nav>
  <span class="tools" id="soc-tools">
    <span class="menu"><button id="b-displays">Displays &#9662;</button><div class="list" id="m-displays" hidden></div></span>
    <span class="menu"><button id="b-panels">Panels &#9662;</button><div class="list" id="m-panels" hidden></div></span>
  </span>
  <div id="summary"></div>
  <div class="grow">
    <label>Op <input id="op" value="operator" maxlength="20"></label>
    <span id="upd">connecting...</span>
  </div>
</header>
<div id="err" hidden></div>

<section class="console" id="c-soc">
  <div class="zone" id="z-displays"><div class="tabs" hidden></div><div class="panes"></div></div>
  <div class="zone" id="z-panels"><div class="tabs" hidden></div><div class="panes"></div></div>
</section>
<section class="console" id="c-trend" hidden></section>
<section class="console" id="c-storm" hidden></section>

<div id="modal" hidden>
  <div class="mbox">
    <h3 id="m-title"></h3>
    <div id="m-state"></div>
    <div class="mrow"><button id="m-open">OPEN</button><button id="m-close">CLOSE</button></div>
    <div id="m-msg"></div>
    <button id="m-cancel">Close</button>
  </div>
</div>

<script src="/static/js/core.js?v={{ v }}"></script>
<script src="/static/js/views.js?v={{ v }}"></script>
<script src="/static/js/fmap.js?v={{ v }}"></script>
<script src="/static/js/trend.js?v={{ v }}"></script>
<script src="/static/js/storm.js?v={{ v }}"></script>
<script src="/static/js/workspace.js?v={{ v }}"></script>
<script>startWorkspace(); startCore();</script>
</body>
</html>
